<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #49330c; background: #fff9e8; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 2rem; display: grid; place-items: center; }
    .page-layout {
      width: min(100%, 54rem);
      display: grid;
      grid-template-columns: minmax(3.5rem, 0.45fr) minmax(0, 4fr) minmax(3.5rem, 0.45fr);
      grid-template-rows: 3.5rem auto 3.5rem;
      gap: 1rem;
      align-items: stretch;
    }
    main { width: 100%; max-width: 38rem; justify-self: center; padding: 2rem; text-align: center; background: #fff; border: 2px solid #f6b938; border-radius: 1rem; }
    .placeholder {
      display: grid;
      place-items: center;
      min-width: 0;
      padding: 0.5rem;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
      color: inherit;
      text-decoration: none;
      background: #fff4cf;
      border: 2px solid #f6b938;
      border-radius: 0.75rem;
    }
    a.placeholder:hover,
    a.placeholder:focus-visible { background: #ffeaa1; outline: 3px solid #49330c; outline-offset: 2px; }
    .placeholder-top { grid-column: 1 / -1; }
    .placeholder-left { grid-column: 1; grid-row: 2; writing-mode: vertical-rl; }
    .placeholder-right { grid-column: 3; grid-row: 2; writing-mode: vertical-rl; }
    .placeholder-bottom { grid-column: 1 / -1; }
    h1 { margin-top: 0; }
    a { color: #754b08; }
    @media (max-width: 480px) {
      body { padding: 1rem; }
      .page-layout {
        grid-template-columns: minmax(2.5rem, 0.45fr) minmax(0, 4fr) minmax(2.5rem, 0.45fr);
        gap: 0.5rem;
      }
      main { padding: 1rem; }
      .placeholder { font-size: 0.75rem; }
    }
  </style>
</head>
<body>
  <div class="page-layout">
    <a class="placeholder placeholder-top" href="circle-4-top.html" aria-label="Open the top bar page">Sibilings</a>
    <a class="placeholder placeholder-left" href="circle-4-left.html" aria-label="Open the left bar page">Parents</a>
    <main>
      <h1>Family</h1>
      <p>Family can offer connection, support, shared traditions, and a sense of belonging.</p>
      <p>Family is a big part of who I am, they influence my decisions, shape my values, and are my motivation for doing certain things.</p>
      <a href="index.html">Back to the honeycomb</a>
    </main>
    <a class="placeholder placeholder-right" href="circle-4-right.html" aria-label="Open the right bar page">Cousins</a>
    <a class="placeholder placeholder-bottom" href="circle-4-bottom.html" aria-label="Open the bottom bar page">Extended Family</a>
  </div>
</body>
</html>
